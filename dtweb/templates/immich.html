{% extends "base.html" %}
{% block title %}Immich · darktable-api{% endblock %}
{% block main %}
<div class="im-page" id="im" hidden>
  <div class="bar">
    <span id="im-line">inbox: album <b id="im-inbox"></b> in Immich · checked <span id="im-when">…</span></span>
    <button id="im-check">check now</button>
    <span id="im-busy" hidden>checking…</span>
  </div>
  <p id="im-err" class="status"></p>
  <h3>waiting</h3>
  <div id="im-waiting" class="grid"></div>
  <p id="im-waiting-empty" class="dim" hidden>nothing waiting: put photos in the inbox album in Immich.</p>
  <h3>sent</h3>
  <div id="im-sent" class="grid"></div>
  <p id="im-sent-empty" class="dim" hidden>nothing sent yet.</p>
  <form id="im-open-form" class="open-form">
    <label for="im-asset">open from Immich:</label>
    <input id="im-asset" placeholder="asset id or URL" autocomplete="off" spellcheck="false">
    <button>open</button>
    <span id="im-open-msg" class="status"></span>
  </form>
</div>
<p id="im-off" class="banner" hidden></p>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const JPEG = 'exposure, white balance and highlights are baked in: less latitude than a raw';
  let st = null;
  const ago = (t) => {
    if (!t) return 'not yet';
    const s = Math.max(0, Date.now() / 1000 - t);
    return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago';
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  function tile(p, kind) {
    const f = el('figure', 'tile');
    if (p.image_id != null) {
      const a = el('a'); a.href = '/photo/' + p.image_id;
      const img = el('img'); img.loading = 'lazy'; img.alt = p.file || '';
      img.src = `/thumb/${p.image_id}/${p.version || 0}.jpg`;
      a.append(img); f.append(a);
    }
    const c = el('figcaption');
    const name = el('span', 'name', p.file || p.asset); name.title = p.file || p.asset; c.append(name);
    if (p.taken) c.append(el('span', 'dim', String(p.taken).slice(0, 10)));
    if (p.jpeg_source) { const b = el('span', 'badge', 'JPEG'); b.title = JPEG; c.append(b); }
    if (p.error) c.append(el('span', 'err', 'not imported: ' + p.error));
    if (kind === 'sent') {
      const a = el('a', null, 'in Immich ↗'); a.href = `${st.web}/photos/${p.asset}`; a.target = '_blank'; a.rel = 'noopener'; c.append(a);
      if (p.source) c.append(el('span', 'dim', 'from Immich'));
    }
    f.append(c);
    return f;
  }
  function draw(s) {
    st = s;
    if (!s.configured) { $('#im-off').hidden = false; $('#im-off').textContent = "Immich isn't set up."; return; }
    $('#im').hidden = false;
    $('#im-inbox').textContent = s.inbox;
    $('#im-when').textContent = ago(s.checked);
    $('#im-busy').hidden = !s.running;
    $('#im-err').textContent = s.error ? 'check failed: ' + s.error : (s.inbox_missing || '');
    for (const [id, list, kind] of [['waiting', s.waiting, 'waiting'], ['sent', s.sent, 'sent']]) {
      const box = $('#im-' + id);
      box.textContent = '';
      for (const p of list) box.append(tile(p, kind));
      $('#im-' + id + '-empty').hidden = list.length > 0;
    }
  }
  async function load(check) {
    $('#im-check').disabled = true;
    if (check) { $('#im-busy').hidden = false; }
    try {
      const r = await fetch('/api/immich' + (check ? '/check' : ''), check ? {method: 'POST'} : {});
      const s = await r.json();
      if (!r.ok) { $('#im-off').hidden = false; $('#im-off').textContent = s.detail; return; }
      draw(s);
      if (s.running) setTimeout(() => load(false), 2000);
    } finally { $('#im-check').disabled = false; }
  }
  $('#im-check').onclick = () => load(true);
  $('#im-open-form').onsubmit = async (e) => {
    e.preventDefault();
    const asset = $('#im-asset').value.trim();
    if (!asset) return;
    $('#im-open-msg').textContent = 'importing…';
    const r = await fetch('/api/immich/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({asset})});
    const s = await r.json();
    if (!r.ok) { $('#im-open-msg').textContent = 'failed: ' + s.detail; return; }
    location.href = '/photo/' + s.image_id;
  };
  load(false).then(() => { if (st && st.configured && st.checked == null && !st.running) load(true); });
  setInterval(() => load(false), 15000);
})();
</script>
{% endblock %}
